[project]
name = "fastdoctor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anand-17284", email = "anandbaskar031@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
fastdoctor = "fastdoctor:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
